<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PharmaManage Pro - Interactive</title>
    <style>
        /* CSS Styles */
        :root {
            --primary: #0f172a;
            --secondary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --light: #f1f5f9;
            --white: #ffffff;
            --text-main: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--light);
            color: var(--text-main);
        }

        header {
            background: var(--primary);
            color: var(--white);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 1.5rem; }
        
        .stat-box {
            background: var(--secondary);
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 3fr;
            gap: 2rem;
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: var(--white);
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .card h3 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 2px solid var(--light);
            padding-bottom: 10px;
        }

        /* Form Styles */
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; }
        .form-group input {
            width: 100%; padding: 10px; border: 1px solid #cbd5e1; 
            border-radius: 4px; box-sizing: border-box;
        }

        button {
            background-color: var(--secondary);
            color: white; border: none; padding: 10px 15px;
            border-radius: 4px; cursor: pointer; font-weight: bold;
            width: 100%; transition: 0.2s;
        }
        button:hover { filter: brightness(90%); }
        
        .btn-success { background-color: var(--success); width: auto; font-size: 0.8rem; padding: 5px 10px;}
        .btn-danger { background-color: var(--danger); width: auto; font-size: 0.8rem; padding: 5px 10px;}

        /* Table Styles */
        .table-container {
            max-height: 600px;
            overflow-y: auto;
        }

        table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: var(--light); position: sticky; top: 0; z-index: 10; font-weight: 600;}
        
        .actions {
            display: flex;
            gap: 5px;
        }

        .total-price {
            font-weight: bold;
            color: var(--success);
        }

    </style>
</head>
<body>

    <header>
        <h1>PharmaManage System</h1>
        <div class="stat-box" id="grandTotalDisplay">
            Total Inventory Value: 0 PKR
        </div>
    </header>

    <div class="dashboard">
        
        <div class="card" style="height: fit-content;">
            <h3>Add New Medicine</h3>
            <form id="addMedForm">
                <div class="form-group">
                    <label for="medId">Medicine ID / Barcode</label>
                    <input type="text" id="medId" required placeholder="e.g. M021">
                </div>
                <div class="form-group">
                    <label for="medName">Medicine Name</label>
                    <input type="text" id="medName" required placeholder="e.g. Panadol">
                </div>
                <div class="form-group">
                    <label for="medPrice">Price per Unit (PKR)</label>
                    <input type="number" id="medPrice" required min="1" placeholder="e.g. 30">
                </div>
                <div class="form-group">
                    <label for="medStock">Initial Stock</label>
                    <input type="number" id="medStock" required min="0" placeholder="e.g. 100">
                </div>
                <button type="submit">Add to Inventory</button>
            </form>
        </div>

        <div class="card table-container">
            <h3>Live Inventory Management</h3>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Medicine Name</th>
                        <th>Price (PKR)</th>
                        <th>Stock Left</th>
                        <th>Total Value (PKR)</th>
                        <th>Actions (Manage Stock)</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                    </tbody>
            </table>
        </div>

    </div>

    <script>
        // --- 1. Database Initialization ---
        // We use localStorage to save data between page refreshes.
        let inventory = JSON.parse(localStorage.getItem('pharmaInventory'));

        // If no data exists in localStorage, load the default starter pack
        if (!inventory) {
            inventory = [
                { id: "M001", name: "Panadol", price: 30, stock: 500 },
                { id: "M002", name: "Augmentin 625mg", price: 250, stock: 120 },
                { id: "M003", name: "Brufen 400mg", price: 45, stock: 300 },
                { id: "M004", name: "Flagyl 400mg", price: 120, stock: 150 }
            ];
            saveData();
        }

        // --- 2. Core Functions ---

        // Save current inventory array to browser storage
        function saveData() {
            localStorage.setItem('pharmaInventory', JSON.stringify(inventory));
        }

        // Render the table and calculate totals
        function renderTable() {
            const tbody = document.getElementById('inventoryTableBody');
            const grandTotalDisplay = document.getElementById('grandTotalDisplay');
            
            tbody.innerHTML = ''; // Clear table
            let grandTotal = 0;

            inventory.forEach((med, index) => {
                const totalItemValue = med.price * med.stock;
                grandTotal += totalItemValue;

                const row = `<tr>
                    <td>${med.id}</td>
                    <td><strong>${med.name}</strong></td>
                    <td>${med.price}</td>
                    <td><strong>${med.stock}</strong></td>
                    <td class="total-price">${totalItemValue.toLocaleString()}</td>
                    <td class="actions">
                        <button class="btn-success" onclick="checkIn('${med.id}')">+ Check In</button>
                        <button class="btn-secondary" style="width:auto; font-size: 0.8rem; padding: 5px 10px; background-color:#f59e0b;" onclick="checkOut('${med.id}')">- Check Out</button>
                        <button class="btn-danger" onclick="deleteMedicine('${med.id}')">Delete</button>
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });

            grandTotalDisplay.innerText = `Total Inventory Value: ${grandTotal.toLocaleString()} PKR`;
        }

        // --- 3. Interactive Actions ---

        // Add a brand new medicine
        document.getElementById('addMedForm').addEventListener('submit', function(e) {
            e.preventDefault(); // Prevent page refresh

            const id = document.getElementById('medId').value;
            const name = document.getElementById('medName').value;
            const price = parseFloat(document.getElementById('medPrice').value);
            const stock = parseInt(document.getElementById('medStock').value);

            // Check if ID already exists
            if (inventory.find(m => m.id === id)) {
                alert("Error: A medicine with this ID already exists!");
                return;
            }

            inventory.push({ id, name, price, stock });
            saveData();
            renderTable();
            this.reset(); // Clear form inputs
        });

        // Check In (Add stock to existing)
        function checkIn(id) {
            const amount = parseInt(prompt("Enter quantity to CHECK IN (add to stock):", "10"));
            if (!isNaN(amount) && amount > 0) {
                const med = inventory.find(m => m.id === id);
                med.stock += amount;
                saveData();
                renderTable();
            }
        }

        // Check Out (Sell stock from existing)
        function checkOut(id) {
            const med = inventory.find(m => m.id === id);
            const amount = parseInt(prompt(`Enter quantity to CHECK OUT (sell).\nCurrent stock: ${med.stock}`, "1"));
            
            if (!isNaN(amount) && amount > 0) {
                if (amount > med.stock) {
                    alert("Error: Cannot check out more than current stock!");
                } else {
                    med.stock -= amount;
                    saveData();
                    renderTable();
                }
            }
        }

        // Delete a medicine entirely
        function deleteMedicine(id) {
            const med = inventory.find(m => m.id === id);
            if (confirm(`Are you sure you want to completely delete ${med.name} from the system?`)) {
                inventory = inventory.filter(m => m.id !== id);
                saveData();
                renderTable();
            }
        }

        // Initialize table on first load
        window.onload = renderTable;

    </script>
</body>
</html>
